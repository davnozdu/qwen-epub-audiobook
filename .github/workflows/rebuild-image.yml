name: rebuild image

# Каждый push в этот репозиторий автоматически запускает сборку образа
# бота (ghcr.io/davnozdu/qwen-colab-book-gen): там конвейер вендорится
# из этого репозитория при сборке. Без этого триггера сборку надо было
# запускать вручную через workflow_dispatch в другом репозитории.
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Запустить сборку образа в qwen-colab-book-gen
        run: |
          curl -fsS -X POST https://api.github.com/repos/davnozdu/qwen-colab-book-gen/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: token ${{ secrets.IMAGE_BUILD_TRIGGER }}" \
            -d '{"event_type": "rebuild", "client_payload": {"sha": "${{ github.sha }}"}}'
